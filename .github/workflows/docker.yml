name: Docker

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af

      - name: Set lowercase name
        run: echo "LOWER_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.DIY
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.LOWER_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Keep the published package public
        run: |
          gh api -X PUT \
            "user/packages/${{ github.event.repository.name }}/container/visibility" \
            -f package_type=container \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: |
          docker rm -f dsh-smoke 2>/dev/null || true
          docker pull ghcr.io/${{ env.LOWER_NAME }}:latest
          docker run -d --name dsh-smoke -p 3080:3080 \
            -e DEEPSEEK_API_KEY=unused \
            ghcr.io/${{ env.LOWER_NAME }}:latest
          for i in $(seq 1 60); do
            docker logs dsh-smoke 2>&1 | grep -q 'dsh web:' && break
            sleep 2
          done
          docker logs dsh-smoke
          url=$(docker logs dsh-smoke 2>&1 | grep -o 'http://[^ ]*token=[^ ]*' | head -1)
          test -n "$url"
          curl -fsS "$url" -o /dev/null
          docker rm -f dsh-smoke
          docker run --rm \
            -e DEEPSEEK_API_KEY=unused \
            ghcr.io/${{ env.LOWER_NAME }}:latest \
            headless --help | grep -q 'Answer one task and exit'

      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'true'
