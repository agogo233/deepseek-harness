name: Docker

on:
  push:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/jvm
          sudo docker image prune -af

      - name: Set lowercase name
        run: echo "LOWER_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          docker buildx build --progress=plain \
            -f Dockerfile.DIY \
            -t "ghcr.io/${LOWER_NAME}:latest" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push . 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: build.log
          retention-days: 3

      - name: Keep the published package public
        run: |
          package="${GITHUB_REPOSITORY##*/}"
          owner_type="$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r .owner.type)"
          if [[ "$owner_type" == "Organization" ]]; then
            base="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package}"
          else
            base="user/packages/container/${package}"
          fi
          response="$(curl -sS -w '\nHTTP %{http_code}' -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"visibility":"public"}' \
            "https://api.github.com/${base}")"
          echo "$response"
          echo "$response" | grep -q '"visibility":"public"'

      - name: Smoke test
        run: |
          docker rm -f dsh-smoke 2>/dev/null || true
          docker pull ghcr.io/${{ env.LOWER_NAME }}:latest
          docker run -d --name dsh-smoke -p 3080:3080 \
            -e DEEPSEEK_API_KEY=unused \
            ghcr.io/${{ env.LOWER_NAME }}:latest
          for i in $(seq 1 60); do
            docker logs dsh-smoke 2>&1 | grep -q 'dsh web:' && break
            sleep 2
          done
          docker logs dsh-smoke
          url=$(docker logs dsh-smoke 2>&1 | grep -o 'http://[^ ]*token=[^ ]*' | head -1)
          test -n "$url"
          curl -fsS "$url" -o /dev/null
          docker rm -f dsh-smoke
          docker run --rm \
            -e DEEPSEEK_API_KEY=unused \
            ghcr.io/${{ env.LOWER_NAME }}:latest \
            headless --help | grep -q 'Answer one task and exit'

      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'true'
